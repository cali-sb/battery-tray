<!doctype html>
<html>
<head><meta charset="utf-8"><title>Litio</title></head>
<body>
<canvas id="c"></canvas>
<script src="key.js"></script>
<script>
const URL_ESTADO = "http://127.0.0.1:47631/battery.json";
const GENERIC_ACTION = "device"; // Esta acción elige dispositivo; las antiguas lo llevan en el UUID.
const keys = new Map(); // contexto -> dispositivo
const painted = new Map(); // contexto -> lo último dibujado, para no repintar igual
let socket, data = null;

function deviceOf(action, settings) {
  const name = action.split(".").pop();
  return name === GENERIC_ACTION ? (settings && settings.device) || "" : name;
}

function paint(context) {
  const key = keys.get(context);
  const device = data && data[key];
  const signature = key + JSON.stringify(device && [device.level, device.online, device.charging, device.name, device.kind]);
  if (painted.get(context) === signature) return;
  painted.set(context, signature);
  const image = renderKey(document.getElementById("c"), key, device);
  socket.send(JSON.stringify({ event: "setImage", context, payload: { image, target: 0 } }));
}

function paintAll() {
  keys.forEach((_, context) => paint(context));
}

// El Stream Deck frena los temporizadores del plugin a uno por minuto cuando lleva un rato
// en segundo plano. Por eso no se pregunta cada segundo: se deja una petición abierta que el
// programa contesta en cuanto algo cambia (o a los 25 s), y al llegar se lanza la siguiente.
async function listen() {
  let version = "";
  for (;;) {
    try {
      const response = await fetch(URL_ESTADO + "?since=" + version, { cache: "no-store" });
      if (response.status === 404) return poll(); // Programa anterior a la 2.4.0.
      if (!response.ok) throw new Error(response.status);
      const reply = await response.json();
      version = reply.version;
      data = reply.devices;
    } catch (e) {
      data = null;
      version = "";
      paintAll();
      await new Promise((done) => setTimeout(done, 2000)); // Programa cerrado o API apagada.
      continue;
    }
    paintAll();
  }
}

function poll() {
  const refresh = async () => {
    try {
      data = await (await fetch(URL_ESTADO, { cache: "no-store" })).json();
    } catch (e) {
      data = null;
    }
    paintAll();
  };
  refresh();
  setInterval(refresh, 1000);
}

function connectElgatoStreamDeckSocket(port, uuid, registerEvent) {
  socket = new WebSocket("ws://127.0.0.1:" + port);
  socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
  socket.onmessage = (msg) => {
    const m = JSON.parse(msg.data);    if (m.event === "willAppear" || m.event === "didReceiveSettings") {
      keys.set(m.context, deviceOf(m.action, m.payload.settings));
      painted.delete(m.context); // Al volver a la página la tecla llega vacía.
      paint(m.context);
    } else if (m.event === "willDisappear") {
      keys.delete(m.context);
      painted.delete(m.context);
    } else if (m.event === "sendToPlugin" && m.payload.get === "devices") {
      // El panel de ajustes de la tecla no puede leer la API: se le pasa lo que ya hay aquí.
      socket.send(JSON.stringify({
        event: "sendToPropertyInspector", action: m.action, context: m.context, payload: { devices: data }
      }));
    }
  };
  listen();
}
</script>
</body>
</html>
