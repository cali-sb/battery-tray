<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Litio</title>
<style>
  body { margin: 0; padding: 8px; background: #2d2d2d; color: #d8d8d8; font: 13px "Segoe UI", sans-serif; }
  label { display: flex; align-items: center; gap: 8px; }
  select { flex: 1; min-width: 0; padding: 4px; background: #3d3d3d; color: inherit; border: 0; border-radius: 3px; }
  p { margin: 8px 0 0; color: #9a9a9a; }
</style>
</head>
<body>
<label>Dispositivo <select id="device"></select></label>
<p id="hint" hidden>Sin datos: abre Litio y activa el Stream Deck en Ajustes, General.</p>
<script>
// La lista se pide al plugin por el Stream Deck, no a la API: la API rechaza las peticiones
// con cabecera Origin, y esta página la manda.
const select = document.getElementById("device");

function fill(data, chosen) {
  document.getElementById("hint").hidden = data !== null;
  data = data || {};
  select.replaceChildren(new Option("Elegir…", ""));
  for (const [key, device] of Object.entries(data)) select.add(new Option(device.name, key));
  if (chosen && !(chosen in data)) select.add(new Option(chosen, chosen));
  select.value = chosen || "";
}

// El Stream Deck llama a esta función por su nombre, el mismo que en el plugin.
function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
  const { action, payload } = JSON.parse(actionInfo);
  let chosen = payload.settings.device;
  const socket = new WebSocket("ws://127.0.0.1:" + port);
  const send = (message) => socket.send(JSON.stringify({ action, context: uuid, ...message }));
  socket.onopen = () => {
    socket.send(JSON.stringify({ event: registerEvent, uuid }));
    send({ event: "sendToPlugin", payload: { get: "devices" } });
  };
  socket.onmessage = (msg) => {
    const m = JSON.parse(msg.data);
    if (m.event === "sendToPropertyInspector" && "devices" in m.payload) fill(m.payload.devices, chosen);
  };
  select.onchange = () => {
    chosen = select.value;
    send({ event: "setSettings", payload: { device: chosen } });
  };
  fill({}, chosen);
}
</script>
</body>
</html>
