<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Litio</title>
<style>
  body { margin: 0; padding: 8px; background: #2d2d2d; color: #d8d8d8; font: 13px "Segoe UI", sans-serif; }
  label { display: flex; align-items: center; gap: 8px; }
  select { flex: 1; min-width: 0; padding: 4px; background: #3d3d3d; color: inherit; border: 0; border-radius: 3px; }
  p { margin: 8px 0 0; color: #9a9a9a; }
</style>
</head>
<body>
<label>Dispositivo <select id="device"></select></label>
<p id="hint" hidden>Sin datos: abre Litio y activa el Stream Deck en Ajustes, General.</p>
<script>
const URL_ESTADO = "http://127.0.0.1:47631/battery.json";
const select = document.getElementById("device");

async function fill(chosen) {
  let data = {};
  try {
    data = await (await fetch(URL_ESTADO, { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("hint").hidden = false;
  }
  select.replaceChildren(new Option("Elegir…", ""));
  for (const [key, device] of Object.entries(data)) select.add(new Option(device.name, key));
  if (chosen && !(chosen in data)) select.add(new Option(chosen, chosen));
  select.value = chosen || "";
}

function connectElgatoStreamDeckPropertyInspector(port, uuid, registerEvent, info, actionInfo) {
  const socket = new WebSocket("ws://127.0.0.1:" + port);
  socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
  select.onchange = () => socket.send(JSON.stringify({
    event: "setSettings", context: uuid, payload: { device: select.value }
  }));
  fill(JSON.parse(actionInfo).payload.settings.device);
}
</script>
</body>
</html>
